services:
  postgres:
    image: postgres:18-alpine
    container_name: flip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: flip
      POSTGRES_DB: flip
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flip -d flip"]
      interval: 5s
      timeout: 5s
      retries: 10
