name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level (used when 'version' is empty)"
        required: false
        default: minor
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      version:
        description: "Explicit version (e.g. 1.2.3). Overrides 'bump' if set."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: compute
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$last_tag" ]; then
            last="0.0.0"
            range=""
          else
            last="${last_tag#v}"
            range="${last_tag}..HEAD"
          fi
          IFS=. read -r major minor patch <<EOF
          $last
          EOF

          if [ -n "$INPUT_VERSION" ]; then
            next="$INPUT_VERSION"
          else
            bump="$INPUT_BUMP"
            if [ "$bump" = "auto" ]; then
              if [ -n "$range" ] && git log "$range" --pretty=%B | grep -qE '(BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:)'; then
                bump="major"
              elif [ -n "$range" ] && git log "$range" --pretty=%B | grep -qE '^feat(\([^)]*\))?:'; then
                bump="minor"
              elif [ -n "$range" ] && git log "$range" --pretty=%B | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
                bump="patch"
              else
                bump="minor"
              fi
              echo "[auto] inferred bump=$bump from commits since ${last_tag:-(initial)}"
            fi
            case "$bump" in
              major) next="$((major+1)).0.0" ;;
              minor) next="${major}.$((minor+1)).0" ;;
              patch) next="${major}.${minor}.$((patch+1))" ;;
              *) echo "unknown bump $bump"; exit 1 ;;
            esac
          fi

          # Strip any leading "v" the user typed.
          next="${next#v}"

          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "tag v$next already exists; aborting"
            exit 1
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next"     >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (prev: ${last_tag:-none})"

      - name: Create + push tag
        run: |
          set -euo pipefail
          git tag -a "${{ steps.compute.outputs.tag }}" -m "Release ${{ steps.compute.outputs.tag }}"
          git push origin "${{ steps.compute.outputs.tag }}"

  image:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/flip
          tags: |
            type=raw,value=${{ needs.tag.outputs.version }}
            type=raw,value=v${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
